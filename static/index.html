<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>File Sharing App</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/styles.css" />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="container">
            <h1 class="text-center mb-4">File Sharing App</h1>

            <div class="upload-area">
                <div id="drop-zone" class="drop-zone">
                    <!-- Modify the drop zone prompt -->
                    <span class="drop-zone__prompt"
                        >Drop files here or click to upload (Multiple files
                        allowed)</span
                    >
                    <!-- Add multiple attribute to file input -->
                    <input
                        type="file"
                        id="file-input"
                        class="drop-zone__input"
                        multiple
                    />
                    <!-- Drag & Drop Zone -->
                </div>

                <!-- Upload Button -->
                <button
                    type="button"
                    id="upload-btn"
                    class="btn btn-primary mt-3"
                >
                    Upload Selected File
                </button>
            </div>

            <div
                id="download-link"
                class="alert alert-success mt-3"
                style="display: none"
            >
                <strong>Success!</strong> Download your file:
                <a id="download-url" href="#">Click here</a>.
            </div>
            <div class="file-list mt-5">
                <h3 class="text-center mb-3">Available Files</h3>
                <div class="list-group" id="file-list-container">
                    <!-- Files will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <script src="/static/script.js"></script>
    </body>
</html>
